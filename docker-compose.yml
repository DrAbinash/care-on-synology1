# =============================================================================
# Care Diagnostics ERP - Preserve existing user + DB patch V2
#
# Fixes clinic_settings save error:
#   PostgreSQL error 42703 missing column near "ollama_known_models"
#
# Keeps old DB volume:
#   db_data:/var/lib/postgresql/data
# So existing login/data remains.
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: care-db
    restart: unless-stopped
    ports:
      - "${DB_HOST_PORT:-5400}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-erp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-diagnostic_erp}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-erp} -d ${DB_NAME:-diagnostic_erp}"]
      interval: 5s
      timeout: 5s
      retries: 30

  db-patch-v2:
    image: postgres:16-alpine
    container_name: care-db-patch-v2
    restart: "no"
    environment:
      PGPASSWORD: ${DB_PASSWORD:-changeme}
    command:
      - sh
      - -c
      - |
        echo "Waiting for PostgreSQL..."
        until pg_isready -h db -U ${DB_USER:-erp} -d ${DB_NAME:-diagnostic_erp}; do
          sleep 2
        done

        echo "Applying DB patch V2 for clinic_settings/payment/scan/Ollama columns..."
        psql -h db -U ${DB_USER:-erp} -d ${DB_NAME:-diagnostic_erp} <<'SQL'

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS active_payment_gateway text DEFAULT 'icici';

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS enable_card_payment boolean DEFAULT true;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS enable_qr_payment boolean DEFAULT true;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS enable_vip_booking boolean DEFAULT false;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS enable_payment_logos boolean DEFAULT true;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS enable_payment_timer boolean DEFAULT true;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS custom_icici_banner_url text;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS custom_phonepe_banner_url text;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS custom_bharatpe_banner_url text;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS custom_payu_banner_url text;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS ollama_base_url text;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS ollama_model text;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS ollama_local_only boolean DEFAULT true;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS ollama_known_models jsonb DEFAULT '[]'::jsonb;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS ollama_fallback_url text;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS ollama_enabled boolean DEFAULT false;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS ollama_timeout_seconds integer DEFAULT 30;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS ollama_audit_enabled boolean DEFAULT true;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS mobile_scan_enabled boolean DEFAULT false;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS phone_pairing_enabled boolean DEFAULT false;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS preferred_scanner text;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS require_desktop_confirmation boolean DEFAULT true;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS auto_delete_temp_scans boolean DEFAULT true;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS ocr_enabled boolean DEFAULT false;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS aadhaar_qr_enabled boolean DEFAULT false;

        ALTER TABLE IF EXISTS online_bookings
        ADD COLUMN IF NOT EXISTS failure_reason text;

        ALTER TABLE IF EXISTS online_bookings
        ADD COLUMN IF NOT EXISTS icici_transaction_id text;

        ALTER TABLE IF EXISTS online_bookings
        ADD COLUMN IF NOT EXISTS icici_provider_ref_id text;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS session_idle_timeout_minutes integer DEFAULT 30;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS default_max_concurrent_sessions integer DEFAULT 3;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS max_failed_login_attempts integer DEFAULT 5;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS account_lockout_duration_minutes integer DEFAULT 30;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS form_f_billing_prompt boolean DEFAULT false;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS form_f_address_required boolean DEFAULT true;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS form_f_guardian_required boolean DEFAULT true;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS online_booking_services text DEFAULT '{"opd":true,"emergency":true,"usg":true,"xray":true,"ct":true,"mri":true,"pathology":true,"packages":true,"home_collection":true,"doctor":true}';
        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS service_images text DEFAULT '{}';

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS service_images_enabled boolean DEFAULT false;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS vip_percentage numeric(5,2) DEFAULT '50.00';

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS disclaimer_text text DEFAULT 'Online booking charges are subject to the centre''s cancellation policy. In case of cancellation after confirmation, administrative charges may be deducted from the refundable amount.';

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS disclaimer_refund_percentage integer DEFAULT 90;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS disclaimer_cancellation_window_hours integer DEFAULT 24;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS disclaimer_display_position text DEFAULT 'bottom';

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS disclaimer_font_size text DEFAULT 'sm';

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS disclaimer_enabled boolean DEFAULT true;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS scanner_global_enabled boolean DEFAULT false;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS scan_station_kiosk_mode_enabled boolean DEFAULT true;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS scan_station_auto_clear_enabled boolean DEFAULT true;

        ALTER TABLE IF EXISTS clinic_settings
        ADD COLUMN IF NOT EXISTS scan_station_result_display_seconds integer DEFAULT 10;

        CREATE TABLE IF NOT EXISTS payment_logs (
          id serial PRIMARY KEY,
          booking_id integer,
          provider text,
          event_type text,
          status text,
          request_payload jsonb,
          response_payload jsonb,
          failure_reason text,
          created_at timestamp DEFAULT now()
        );

        SQL

        echo "DB patch V2 finished."
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: care-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${DB_USER:-erp}:${DB_PASSWORD:-changeme}@db:5432/${DB_NAME:-diagnostic_erp}
      NODE_ENV: production
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}

      JWT_SECRET: ${JWT_SECRET:-care-diagnostics-jwt-secret-2026-change-later}
      SESSION_SECRET: ${SESSION_SECRET:-care-diagnostics-session-secret-2026-change-later}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}

      OBJECT_STORAGE_DIR: ${OBJECT_STORAGE_DIR:-/app/data/object-storage}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://caredeoghar.com}
      SUPER_ADMIN_USB_KEY: ${SUPER_ADMIN_USB_KEY:-d350487e-e1ec-452e-994e-bddb9fb96605}

      ICICI_BASE_URL: ${ICICI_BASE_URL:-https://pgpay.icicibank.com}
      ICICI_URL_PREFIX: ${ICICI_URL_PREFIX:-/pg/api/v2}
      ICICI_MERCHANT_ID: ${ICICI_MERCHANT_ID:-100000000455452}
      ICICI_AGGREGATOR_ID: ${ICICI_AGGREGATOR_ID:-100000000455451}
      ICICI_SECRET_KEY: ${ICICI_SECRET_KEY:-d350487e-e1ec-452e-994e-bddb9fb96605}

      FINGERPRINT_BRIDGE_SECRET: ${FINGERPRINT_BRIDGE_SECRET:-}
      ORTHANC_URL: ${ORTHANC_URL:-}
      ORTHANC_USERNAME: ${ORTHANC_USERNAME:-}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:-}
      PACS_PROVIDER: ${PACS_PROVIDER:-orthanc}
      PACS_VIEWER_TYPE: ${PACS_VIEWER_TYPE:-ohif}
      OHIF_URL: ${OHIF_URL:-}
      WADO_URL: ${WADO_URL:-}
    volumes:
      - object_storage:/app/data/object-storage
    depends_on:
      db:
        condition: service_healthy
      db-patch-v2:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: care-web
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8888}:80"
    depends_on:
      - api

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    container_name: care-migrate
    environment:
      DATABASE_URL: postgres://${DB_USER:-erp}:${DB_PASSWORD:-changeme}@db:5432/${DB_NAME:-diagnostic_erp}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  object_storage:
