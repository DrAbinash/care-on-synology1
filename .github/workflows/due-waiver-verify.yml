name: Due waiver verify

on:
  push:
    branches:
      - fix/due-waiver-not-refund

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: API source-contract test
        run: pnpm exec vitest run artifacts/api-server/src/routes/bills.waiveDue.sourceContract.test.ts
      - name: API typecheck
        run: pnpm --filter @workspace/api-server run typecheck
      - name: ERP typecheck
        run: pnpm --filter @workspace/diagnostic-erp run typecheck
