name: Due waiver patch

on:
  push:
    branches:
      - fix/due-waiver-not-refund

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Implement due waiver accounting flow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/due-waiver-not-refund
          fetch-depth: 0
      - name: Patch due-waiver flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected anchor once, found {count}: {old[:80]!r}")
              p.write_text(s.replace(old, new, 1))

          bills = "artifacts/api-server/src/routes/bills.ts"
          refund_anchor = "// Records a refund of `amount`. Inserts a negative-amount payment row so the\n// payment history shows it, decrements paidAmount, increments refundAmount,\n// recomputes balanceAmount + status, audits, and emails.\n"
          waive_route = r'''// Waive the CURRENT unpaid balance by converting it to additional discount.\n// This is deliberately NOT a refund: no negative payment row is created and\n// refundAmount / physical cash are untouched. The amount is server-derived\n// under FOR UPDATE so a concurrent payment cannot be accidentally waived.\nbillsRouter.post("/:id/waive-due", requireStaffSubPermission("/billing", "edit"), async (req: StaffAuthRequest, res) => {\n  const paramsParsed = z.object({ id: z.coerce.number().int().positive() }).safeParse(req.params);\n  const bodyParsed = z.object({ reason: z.string().trim().min(3).max(500) }).safeParse(req.body);\n  if (!paramsParsed.success || !bodyParsed.success) {\n    res.status(400).json({ error: "Invalid request — a reason of at least 3 characters is required" });\n    return;\n  }\n\n  try {\n    const updated = await db.transaction(async (tx) => {\n      const [bill] = await tx\n        .select()\n        .from(billsTable)\n        .where(eq(billsTable.id, paramsParsed.data.id))\n        .for("update")\n        .limit(1);\n\n      if (!bill) throw Object.assign(new Error("Bill not found"), { httpStatus: 404 });\n      if (bill.status === "cancelled") {\n        throw Object.assign(new Error("Bill is cancelled — due cannot be waived"), { httpStatus: 409 });\n      }\n\n      const subtotal = Number(bill.subtotal);\n      const taxAmount = Number(bill.taxAmount);\n      const paidAmount = Number(bill.paidAmount);\n      const refundAmount = Number(bill.refundAmount || 0);\n      const oldDiscount = Number(bill.discount);\n      const oldTotal = Number(bill.totalAmount);\n      const currentBalance = billBalanceFromParts(oldTotal, paidAmount, refundAmount);\n\n      if (refundAmount > 0.01) {\n        throw Object.assign(new Error("Due waiver is not allowed on a bill that already has refunds. Use an audited bill correction instead."), { httpStatus: 409 });\n      }\n      if (currentBalance <= 0.01) {\n        throw Object.assign(new Error("This bill has no outstanding balance to waive"), { httpStatus: 409 });\n      }\n\n      const newDiscount = moneyAdd(oldDiscount, currentBalance);\n      if (newDiscount > subtotal + 0.01) {\n        throw Object.assign(new Error("Outstanding amount cannot be represented as a discount on this bill"), { httpStatus: 409 });\n      }\n\n      const session = req.staffSession;\n      if (session && !FULL_ACCESS_ROLES.has(session.role) && newDiscount > 0) {\n        const maxPct = session.maxDiscount ?? 0;\n        const maxAllowed = Math.round((subtotal * maxPct / 100) * 100) / 100;\n        if (newDiscount > maxAllowed + 0.01) {\n          throw Object.assign(new Error(`Your maximum allowed discount is ${maxPct}% (₹${maxAllowed.toFixed(2)} on this bill). Please ask an admin to waive this due.`), { httpStatus: 403 });\n        }\n      }\n\n      const newTotal = billTotalFromParts(subtotal, newDiscount, taxAmount);\n      const discountGate = assertDiscountNotBelowCollected({\n        subtotal,\n        discount: newDiscount,\n        tax: taxAmount,\n        collectedNet: paidAmount,\n      });\n      if (discountGate) {\n        throw Object.assign(new Error(discountGate), { httpStatus: 400 });\n      }\n\n      const newBalance = billBalanceFromParts(newTotal, paidAmount, 0);\n      const newStatus = newBalance <= 0.01 ? "paid" : paidAmount > 0 ? "partial" : "pending";\n      const [saved] = await tx\n        .update(billsTable)\n        .set({\n          discount: newDiscount.toFixed(2),\n          totalAmount: newTotal.toFixed(2),\n          balanceAmount: newBalance.toFixed(2),\n          status: newStatus,\n        })\n        .where(eq(billsTable.id, bill.id))\n        .returning();\n\n      const actor = session?.subjectName?.trim() || (session ? `staff:${session.id}` : "system");\n      await tx.insert(billAuditsTable).values({\n        billId: bill.id,\n        editedBy: actor,\n        reason: bodyParsed.data.reason,\n        changeType: "balance_waived",\n        oldValue: `total=₹${oldTotal.toFixed(2)}, paid=₹${paidAmount.toFixed(2)}, balance=₹${currentBalance.toFixed(2)}, discount=₹${oldDiscount.toFixed(2)}`,\n        newValue: `waived=₹${currentBalance.toFixed(2)}, total=₹${newTotal.toFixed(2)}, paid=₹${paidAmount.toFixed(2)}, balance=₹${newBalance.toFixed(2)}, discount=₹${newDiscount.toFixed(2)}`,\n      });\n\n      return saved!;\n    });\n\n    res.json(await buildBill(updated));\n  } catch (err: unknown) {\n    const httpStatus = (err as { httpStatus?: number })?.httpStatus;\n    if (httpStatus) {\n      res.status(httpStatus).json({ error: err instanceof Error ? err.message : "Due waiver failed" });\n      return;\n    }\n    throw err;\n  }\n});\n\n'''
          replace_once(bills, refund_anchor, waive_route.replace('\\n', '\n') + refund_anchor)

          ui = "artifacts/diagnostic-erp/src/pages/BillDetail.tsx"
          replace_once(
              ui,
              '  const [refundOpen, setRefundOpen] = useState(false);\n',
              '  const [refundOpen, setRefundOpen] = useState(false);\n  const [waiveOpen, setWaiveOpen] = useState(false);\n  const [waiveReason, setWaiveReason] = useState("");\n',
          )

          form_anchor = '  const { register, handleSubmit, reset, setValue, watch } = useForm<PaymentForm>({ defaultValues: { method: "cash" } });\n'
          waive_mutation = '''  const waiveDue = useMutation({\n    mutationFn: (body: { reason: string }) =>\n      api.post(`/api/bills/${id}/waive-due`, body),\n    onSuccess: () => {\n      queryClient.invalidateQueries({ queryKey: getGetBillQueryKey(id) });\n      queryClient.invalidateQueries({ queryKey: getListBillsQueryKey() });\n      refetchAudits();\n      setWaiveOpen(false);\n      setWaiveReason("");\n      toast({\n        title: "Outstanding balance waived",\n        description: "The unpaid balance was converted to discount. No refund or cash-out entry was created.",\n      });\n    },\n  });\n\n'''
          replace_once(ui, form_anchor, waive_mutation + form_anchor)

          refund_button_anchor = '            {bill.status !== "cancelled" && canRefund && (\n'
          waive_button = '''            {bill.status !== "cancelled" && Number(bill.balanceAmount) > 0.01 && canEdit && (\n              <Button\n                size="sm"\n                variant="outline"\n                onClick={() => { setWaiveReason(""); setWaiveOpen(true); }}\n                className="border-emerald-300 text-emerald-700 hover:bg-emerald-50 dark:text-emerald-400 dark:border-emerald-700 dark:hover:bg-emerald-950"\n                title="Waive the unpaid balance as discount — no cash is returned"\n              >\n                <CheckSquare size={14} className="mr-1" /> Waive Due\n              </Button>\n            )}\n'''
          replace_once(ui, refund_button_anchor, waive_button + refund_button_anchor)

          dialog_anchor = '      {/* Cancel / Refund Dialog with three tabs */}\n'
          waive_dialog = '''      {/* Waive Due Dialog — discount/waiver, never a cash refund */}\n      <Dialog open={waiveOpen} onOpenChange={setWaiveOpen}>\n        <DialogContent className="max-w-md">\n          <DialogHeader>\n            <DialogTitle className="flex items-center gap-2">\n              <CheckSquare size={16} className="text-emerald-600" /> Waive Outstanding Balance\n            </DialogTitle>\n          </DialogHeader>\n          <div className="space-y-4">\n            <div className="bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-900 rounded-lg p-3 text-xs text-emerald-800 dark:text-emerald-300 space-y-1">\n              <p className="font-semibold">This is a discount / waiver — not a refund.</p>\n              <p>No money will be shown as returned to the patient and no negative cash payment will be created.</p>\n            </div>\n            <div className="bg-muted/50 rounded-lg p-3 text-sm space-y-1">\n              <div className="flex justify-between"><span className="text-muted-foreground">Current total</span><span>{formatCurrency(bill.totalAmount)}</span></div>\n              <div className="flex justify-between"><span className="text-muted-foreground">Paid</span><span>{formatCurrency(bill.paidAmount)}</span></div>\n              <div className="flex justify-between font-semibold"><span>Balance to waive</span><span className="text-emerald-700 dark:text-emerald-400">{formatCurrency(bill.balanceAmount)}</span></div>\n              <div className="flex justify-between border-t border-border pt-1 mt-1"><span className="text-muted-foreground">New net total</span><span className="font-bold">{formatCurrency(Math.max(0, Number(bill.totalAmount) - Number(bill.balanceAmount)))}</span></div>\n            </div>\n            <div>\n              <Label>Reason for waiver <span className="text-red-500">*</span></Label>\n              <textarea\n                rows={3}\n                value={waiveReason}\n                onChange={(e) => setWaiveReason(e.target.value)}\n                placeholder="e.g. LESS BY SIR / approved concession"\n                className="mt-1 w-full px-3 py-2 text-sm border border-input rounded-md bg-background focus:outline-none focus:ring-2 focus:ring-ring resize-none"\n              />\n            </div>\n            {waiveDue.isError && (\n              <p className="text-xs text-red-600">{(waiveDue.error as Error)?.message ?? "Unable to waive due"}</p>\n            )}\n            <div className="flex justify-end gap-2">\n              <Button type="button" variant="outline" onClick={() => setWaiveOpen(false)}>Cancel</Button>\n              <Button\n                type="button"\n                disabled={waiveDue.isPending || waiveReason.trim().length < 3}\n                onClick={() => waiveDue.mutate({ reason: waiveReason.trim() })}\n                className="bg-emerald-600 hover:bg-emerald-700 text-white"\n              >\n                {waiveDue.isPending ? "Waiving…" : `Waive ${formatCurrency(bill.balanceAmount)}`}\n              </Button>\n            </div>\n          </div>\n        </DialogContent>\n      </Dialog>\n\n'''
          replace_once(ui, dialog_anchor, waive_dialog + dialog_anchor)

          tab_anchor = '          {/* Tab switcher */}\n'
          refund_warning = '''          {Number(bill.balanceAmount) > 0.01 && (\n            <div className="bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-900 rounded-lg p-3 text-xs text-amber-800 dark:text-amber-300">\n              <strong>Refund means money is physically returned to the patient.</strong> If you only want to forgive the unpaid balance, close this dialog and use <strong>Waive Due</strong> instead.\n            </div>\n          )}\n\n'''
          replace_once(ui, tab_anchor, refund_warning + tab_anchor)

          audit_anchor = '                      a.changeType === "discount" ? "bg-blue-100 text-blue-700" :\n'
          replace_once(ui, audit_anchor, '                      a.changeType === "balance_waived" ? "bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400" :\n' + audit_anchor)

          test = Path("artifacts/api-server/src/routes/bills.waiveDue.sourceContract.test.ts")
          test.write_text(r'''import { describe, expect, it } from "vitest";\nimport { readFileSync } from "node:fs";\nimport { join } from "node:path";\n\nconst src = readFileSync(join(process.cwd(), "src/routes/bills.ts"), "utf8");\n\ndescribe("due waiver accounting contract", () => {\n  it("has a dedicated waive-due endpoint and never posts a payment/refund", () => {\n    const start = src.indexOf('billsRouter.post("/:id/waive-due"');\n    const end = src.indexOf('// Records a refund of `amount`', start);\n    expect(start).toBeGreaterThan(-1);\n    expect(end).toBeGreaterThan(start);\n    const region = src.slice(start, end);\n    expect(region).toContain('changeType: "balance_waived"');\n    expect(region).toContain('discount: newDiscount.toFixed(2)');\n    expect(region).toContain('status: newStatus');\n    expect(region).toContain('.for("update")');\n    expect(region).not.toContain('paymentsTable');\n    expect(region).not.toContain('refundAmount:');\n    expect(region).not.toContain('autoVoucherForPayment');\n  });\n});\n'''.replace('\\n', '\n'))

          # Source-level safety checks before committing.
          api = Path(bills).read_text()
          page = Path(ui).read_text()
          assert 'billsRouter.post("/:id/waive-due"' in api
          assert 'changeType: "balance_waived"' in api
          assert 'Waive Due' in page
          assert 'Refund means money is physically returned to the patient.' in page

          Path(".github/workflows/due-waiver-patch.yml").unlink()
          PY

          git config user.name "CARE ERP Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement due waiver accounting flow"
          git push origin HEAD:fix/due-waiver-not-refund
