name: CI

# Runs the checks that used to only run locally, so the whole class of
# clean-boot / migration-order / type / test regressions is caught on every PR
# instead of at deploy time. See HOW_TO_ADD_DB_MIGRATIONS.md and
# docs/CARE_ERP_MASTER_HANDOVER.md.

on:
  push:
    branches: [feature/website-login-redirection, main, master]
  pull_request:
  # The expensive proof. `identity-image` below builds the production
  # `--target api-build` — a full in-image pnpm install of this monorepo — so it
  # is not a per-PR check; a maintainer asks for it by name, before a deploy.
  workflow_dispatch: {}

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fast, DB-free gates ─────────────────────────────────────────────────────
  static:
    name: Static checks (typecheck, migration order, grounding)
    runs-on: ubuntu-latest
    # Healthy run is ~3 min. Cap so a hung typecheck cannot sit for 6h.
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migration order preflight (DDL + DML dependency order)
        run: node scripts/check-migration-order.cjs
      - name: Architecture grounding (docs match code)
        run: node scripts/grounding-check.cjs
      - name: Committed secrets (shrink-only ratchet)
        # Two live Hope ↔ Care credentials sat in tracked templates while this
        # repository was public. The remaining findings are the owner's rotation
        # decision, so they are recorded per file and any increase — or any
        # un-recorded file — fails the build. Shrinking must be re-recorded, so the
        # baseline can never sit above reality and hide the next finding.
        run: node scripts/check-no-committed-secrets.mjs --baseline scripts/committed-secrets-baseline.json
      - name: Workspace typecheck
        # api-server tsc occasionally OOMs on the default ~2GB heap on ubuntu-latest.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm typecheck

  # ── A real build, because `.dockerignore` cannot be checked by reading it ────
  identity:
    name: Build identity (disposable docker build)
    runs-on: ubuntu-latest
    # Measured 2026-10-15 on the first real run of this job (`5e54b561`): the whole
    # job 39 s, the context tier 24 s, on Docker server 28.0.4. The caps are not
    # sized to that — the context tier leaves ~25x, because the one thing that is
    # not in the measurement is a cold base-image pull on a runner that has decided
    # to evict its cache. `--tier real` has never run anywhere, so its cap is a
    # budget for a full in-image install of this monorepo, not a sized number.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Give the checkout the shape the NAS deploy checkout has
        # actions/checkout leaves HEAD detached at a SHA. `readGitHead()` then
        # resolves the commit from HEAD alone, and hiding `.git/refs` changes
        # nothing — arm C would report a pass it had not earned. `/volume1/docker/
        # care-erp-github/care-on-synology1` is an ordinary clone: HEAD is
        # `ref: refs/heads/main` and the branch lives in a loose ref file, which is
        # exactly the pair `.dockerignore`'s negations have to deliver. So CI asks
        # for that layout before it asks for a verdict.
        run: |
          git checkout -B build-identity-probe "$(git rev-parse HEAD)"
          head -n 1 .git/HEAD
          find .git/refs -type f | sed 's/^/loose ref: /'
      - name: Prove the build context carries the identity (Docker, for real)
        # Exit 0 is PASS. 1 FAIL, 2 UNVERIFIED (an arm the environment could not
        # exercise), 3 UNAVAILABLE (no Docker) — none of those are green, and none
        # of them are `|| true`: a proof that cannot fail is not a proof.
        timeout-minutes: 10
        run: node scripts/docker-build-identity.mjs --tier context --json=tmp/build-identity-context.json
      - name: Prove the production Dockerfile itself resolves its commit
        # The expensive half, and the only half that hashes the bytes the image
        # actually ships. On demand rather than per PR, because it costs an entire
        # dependency install of this monorepo inside the image.
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 25
        run: node scripts/docker-build-identity.mjs --tier real --json=tmp/build-identity-real.json
      - name: Upload the evidence
        # The graded JSON is the artefact a reviewer needs: it carries the Docker
        # version, the checkout SHA, the false stamp that was fed in, and every
        # arm's identity file. Without it the job says "passed" and nothing more.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-identity-proof
          path: tmp/build-identity-*.json
          if-no-files-found: warn

  # ── Full test suite + clean-boot proof against a real Postgres ──────────────
  test:
    name: Tests + migration smoke (real Postgres)
    runs-on: ubuntu-latest
    # Healthy run is ~12 min with Vitest + browser smoke. PR #548 sat >10 min
    # on unbounded apt-get because the job inherited the 6h default. Sized to
    # leave room for the apt step's slow-mirror budget below, and now for the
    # Vitest step's measured 10 min 8 s plus headroom: the job cap is a backstop
    # against a step that escapes its own cap, so it has to exceed the sum of the
    # steps' worst cases (apt 20 + chromium 5 + Vitest 22 + browser 5 = 52, plus the
    # uncapped pnpm install / db:smoke / db:bootstrap) or it silently re-imposes the
    # cap the step sizes removed. Raised 50 -> 60 with the apt step's slow-mirror
    # budget (see scripts/ci-apt-install.sh): at 50 the sum of the step caps would
    # exceed the job, making the job the real cap again. 60 is still 1/6 of the 6h
    # default PR #548 was written against.
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: care_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d care_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # DB-dependent tests read DATABASE_URL; the smoke uses a scratch DB it
      # creates/drops under the admin URL.
      DATABASE_URL: postgresql://erp:erp@localhost:5432/care_test
      MIGRATION_SMOKE_ADMIN_URL: postgresql://erp:erp@localhost:5432/postgres
      JWT_SECRET: ci-e2e-jwt-secret
      SESSION_SECRET: ci-e2e-session-secret
      ENABLE_SCHEDULERS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install CI apt packages (poppler + Playwright system deps)
        # Must exceed every budget inside ci-apt-install.sh (up to 60s lock wait
        # + 120s update + 900s install = 1080s), or the step timeout preempts the
        # retry logic that exists because a slow mirror, not a hung one, is what
        # kills this run. Raised 12 -> 20 when the install budget moved to 900s:
        # run 40519420161 (PR #1203, 2026-10-27) died here at 8m 5s on the old
        # 480s install cap with no test having run, while healthy runs of this
        # same step finish in 12s (measured on main at ec7620c9, run 40524985497).
        timeout-minutes: 20
        run: |
          mapfile -t PW_DEPS < <(grep -v '^[[:space:]]*$' scripts/ci-playwright-apt-packages.txt)
          sudo bash scripts/ci-apt-install.sh poppler-utils "${PW_DEPS[@]}"
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-
      - name: Install Chromium browser (Premium print-layout proof)
        timeout-minutes: 5
        run: pnpm exec playwright install chromium
      - name: Clean-boot + upgrade-safety migration smoke
        run: pnpm db:smoke
      - name: Bootstrap the test database (full migration path)
        run: pnpm db:bootstrap
      - name: Vitest suite (sequential — one shared DB)
        # Measured on `main` at 1841668b (run 38698375279): the suite ran 07:24:21
        # to 07:34:29 = 10 min 8 s, printed `Test Files 1037 passed | 5 skipped`
        # and `Tests 13507 passed | 17 skipped`, and WAS THEN KILLED by the 10-minute
        # cap — eight seconds of headroom on a fully passing suite. A gate that fails
        # because the suite is long is not a gate: nobody reads red CI as "green apart
        # from the clock", so every real failure hides behind this one. 22 min is 2.2x
        # the measured duration, and scripts/ci-workflow-timeouts.test.mjs enforces
        # that ratio — it caught this line claiming "2x" at 20 min, which was 16 short.
        timeout-minutes: 22
        # --no-file-parallelism because the DB-dependent tests share one Postgres
        # database; parallel files collide on rows/ids (proven flaky otherwise).
        run: pnpm exec vitest run --no-file-parallelism
      - name: Browser smoke (login shell)
        timeout-minutes: 5
        run: pnpm e2e:smoke
