# nginx reverse-proxy + static SPA host for Care Diagnostics.
# Serves three web frontends and forwards /api/* to the api container.
#
# July 2026 URL layout:
#   /                         → clinic-site (public website)
#   /erp/                     → diagnostic-erp (staff portal)
#   /erp/website              → website builder/admin (an authenticated ERP
#                                page, NOT part of the public clinic-site —
#                                see the /website redirect below)
#   /super-admin-portal/      → super-admin-portal
#   /api/                     → Express REST API
#   /health                   → Express health check (no /api prefix)

# Preserve the ORIGINAL scheme when a TLS terminator sits in front of us
# (Synology's reverse proxy, Cloudflare, a DSM-managed certificate).
#
# This nginx only ever listens on :80, so $scheme is always "http". Sending
# $scheme straight through as X-Forwarded-Proto overwrote the "https" the
# upstream proxy had already set, and told the API every request was insecure.
# That broke WebAuthn outright: rpFromReq() builds expectedOrigin from this
# header, so it computed "http://<host>" while the browser attested
# "https://<host>", and every security-key registration and sign-in failed the
# origin check. It also made report/booking links render as http:// on an
# HTTPS site.
#
# Trust an upstream value when present, fall back to our own scheme when the
# request came straight to us (LAN / initial setup over plain HTTP).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;
    server_name _;

    # Allow file uploads (lab reports, logos, attachments)
    client_max_body_size 25m;

    # Hide nginx version
    server_tokens off;

    # Set Referrer-Policy to allow domain validation for ICICI Orange Pay
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Security headers — applied to every response
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # HSTS: only sent over HTTPS. On LAN (HTTP) this header is omitted so browsers
    # are not permanently locked out of the HTTP endpoint used during initial setup.
    # Remove the $https condition once the site is permanently HTTPS-only.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Allow ICICI Orange Pay iframe/redirect to load on the payment page
    # ICICI requires the Referrer-Policy to send the full origin (already set above)
    add_header Content-Security-Policy "frame-ancestors 'self' https://pgpay.icicibank.com https://pgpayuat.icicibank.com;" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;


    # ---- Upstream address resolution --------------------------------------
    # The "api" name resolves via docker-compose's internal DNS — but a LITERAL
    # hostname in proxy_pass is resolved ONCE, at config load, and that address
    # is cached for the worker's lifetime. When docker recreates the api
    # container it can come back on a new IP and nginx keeps proxying the dead
    # one: every /api, /uploads, /super-admin-portal and /health request 502s
    # until the WEB container is restarted. /nginx-health keeps returning 200
    # throughout (it never touches the upstream), so `docker ps` still reports
    # care-web healthy for the whole outage.
    #
    # Measured against nginx 1.24 with a stub DNS server: the literal form was
    # still pinned to the dead address 60s after it changed and recovered only
    # on SIGHUP; the variable form below followed the change 7s after the flip
    # with valid=5s. `valid=` overrides the record's own TTL.
    #
    # Putting the address in a variable defers resolution to request time and
    # forces nginx to consult a resolver. 127.0.0.11 is docker's embedded DNS,
    # present in every container on a compose project network — docker-compose.yml
    # declares no `networks:` and no `network_mode:`, so all services sit on the
    # implicit user-defined bridge, where 127.0.0.11 exists.
    #
    #   valid=10s        re-resolve at most every 10s; overrides the record TTL.
    #   ipv6=off         the api container is IPv4-only; skip the AAAA lookup.
    #   resolver_timeout DO NOT REMOVE. With an unreachable resolver and no
    #                    timeout set, every proxied request HANGS for the 30s
    #                    default before failing (measured: 30.005s). 5s turns a
    #                    DNS outage into a prompt 502 instead of stalled workers.
    #
    # ALL FOUR proxied locations below MUST use $api_upstream. If even one
    # proxy_pass keeps the literal host:port form, nginx registers it as an
    # implicit upstream GROUP under that name; the variable form then matches
    # that frozen group by name, the resolver is never queried, and this fix
    # silently becomes a no-op that still passes `nginx -t` and still serves
    # traffic. Measured: with 3 of 4 locations converted, all three stayed
    # pinned and zero DNS queries were sent. Guarded by
    # artifacts/api-server/src/lib/nginxUpstreamResolution.test.ts.
    #
    # The completeness gate is a plain grep, so this comment deliberately does
    # not spell out the old literal — keep it that way or the gate matches its
    # own documentation and can never reach zero.
    #
    # `set` must live here in server{}, NOT at file top-level: this file is
    # included into http{} (which is why the `map` above works there), and `set`
    # is illegal in http context — nginx would refuse to start outright. Keeping
    # it at server level also means no location-local `rewrite ... break` can
    # run before it and leave $api_upstream uninitialised (that yields a 500).
    resolver           127.0.0.11 valid=10s ipv6=off;
    resolver_timeout   5s;
    set $api_upstream  "api:8080";

    # ---- API reverse proxy ------------------------------------------------
    # No URI part on proxy_pass, exactly as before: nginx forwards the raw
    # client request target unchanged. Do NOT "improve" this to
    # http://$api_upstream$request_uri — that form ignores any future rewrite
    # in this block and silently proxies the pre-rewrite URI (measured: with
    # `rewrite ^/api/old/(.*)$ /api/new/$1 break`, the $request_uri form sent
    # /api/old/thing while the form below correctly sent /api/new/thing).
    location /api/ {
        proxy_pass         http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- Uploaded site media (gallery/hero photos, logos, ...) -----------
    # Served by the api container at bare "/uploads/*" (artifacts/api-server/
    # src/app.ts, express.static over data/uploads) — a sibling of /api, not
    # nested under it, because sitePhotosTable.url and every other stored
    # photo URL is a root-relative "/uploads/site/<file>" path with no /api
    # prefix. Without this location, every one of those requests fell
    # through to the SPA catch-all below and got index.html back instead of
    # image bytes — every photo on the public site broke identically.
    location ^~ /uploads/ {
        proxy_pass         http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        # Uploaded filenames are unique per upload (never overwritten), so
        # they're safe to cache aggressively — same convention as the
        # hashed ERP asset block further down.
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- Super Admin Portal (BASE_PATH=/super-admin-portal/) -------------
    # Serves the bootstrap page dynamically from the Express container
    location ^~ /super-admin-portal/ {
        proxy_pass         http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
    }

    # ---- Web container liveness (served by nginx itself) ------------------
    # The web container's Docker HEALTHCHECK hits this. It is answered by
    # nginx directly (no api upstream) so a healthy web container means
    # "nginx is up and serving", independent of the api container's state —
    # avoids a false-unhealthy web during an api restart. See Dockerfile.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- Health check passthrough -----------------------------------------
    # GET /health is registered directly on the Express app (no /api prefix,
    # no auth, no DB query — see Dockerfile HEALTHCHECK comment). Without
    # this explicit location it falls through to the website catch-all at
    # the bottom of this file and returns the SPA's index.html instead of a
    # health payload.
    #
    # proxy_pass deliberately carries NO "/health" URI part any more. This is an
    # exact (`=`) match, so the path is always literally /health — and with a
    # variable in proxy_pass, an explicit URI part is passed "as is" and the
    # query string is SILENTLY DROPPED (/health?probe=1 would reach the API as
    # /health). Dropping the URI part keeps this location byte-for-byte
    # identical to its behaviour under the old literal upstream, verified on
    # /health, /health?x=1 and /health?a=1&b=2%20c. The equivalent explicit form
    # is http://$api_upstream/health$is_args$args.
    location = /health {
        proxy_pass         http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
    }

    # ---- /website convenience redirect ------------------------------------
    # The website builder/admin page is an authenticated ERP feature
    # (artifacts/diagnostic-erp/src/pages/Website.tsx, route "/website"
    # inside the staff-only app shell) — its real address is /erp/website,
    # not a public route. This redirect exists only so a bookmarked or
    # typed bare "/website" still lands somewhere useful instead of hitting
    # the public-website catch-all and showing a 404/"page not found".
    location = /website {
        return 301 /erp/website;
    }

    # ---- Staff ERP (BASE_PATH=/erp/) -------------------------------------
    # Two locations are required:
    #   1. Exact match on bare /erp (no trailing slash) — redirect to /erp/
    #      so the SPA loads with the correct base URL.  Without this, nginx
    #      falls through to "location /" which serves the clinic-site SPA and
    #      that SPA shows "Page not found: /erp doesn't exist or isn't published."
    #      because it finds no website-builder page with slug "erp".
    #   2. Prefix match on /erp/ (with trailing slash) — serves the ERP SPA
    #      with SPA fallback (try_files → /erp/index.html) so that deep links
    #      like /erp/dashboard and /erp/billing work on hard-refresh.
    location = /erp {
        return 301 /erp/;
    }
    location ^~ /erp/ {
        root /usr/share/nginx/html;

        # Hashed Vite build output (erp/assets/*.js, *.css, fonts, images).
        # NOTE: this nested location is required — the outer "^~ /erp/"
        # prefix match takes priority over ANY regex location (including
        # the shared static-asset cache block near the bottom of this
        # file), so without this nested block every ERP JS/CSS chunk was
        # served with NO cache headers at all, forcing the browser to
        # re-fetch already-unchanged files on every navigation. Content
        # hashes in the filename mean it's always safe to cache these
        # "forever" (immutable) — a new build produces new filenames.
        location ~* ^/erp/.*\.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico|webp)$ {
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # The SPA shell itself must always be revalidated so a rebuild's
        # new asset filenames are picked up promptly (this is also what
        # the stale-chunk auto-reload in main.tsx/App.tsx is a safety net
        # for — this header makes hitting that safety net rare).
        location = /erp/index.html {
            try_files $uri =404;
            add_header Cache-Control "no-cache";
        }

        try_files $uri $uri/ /erp/index.html;
    }

    # ---- Public Clinic Website (BASE_PATH=/) — catch-all SPA last --------
    # Excludes /api/, /erp/ (with trailing slash), and the bare /erp path so
    # those routes are handled by their own handlers above and are never
    # swallowed by the website-builder SPA.
    location / {
        root /usr/share/nginx/html/site;
        index index.html;

        location = /index.html {
            try_files $uri =404;
            add_header Cache-Control "no-cache";
        }

        try_files $uri $uri/ /index.html;
    }

    # Long cache for hashed asset files
    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        root /usr/share/nginx/html/site;
        try_files $uri /erp$uri /super-admin-portal$uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
