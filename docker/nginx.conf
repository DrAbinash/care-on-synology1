# nginx reverse-proxy + static SPA host for Care Diagnostics.
# Serves three web frontends and forwards /api/* to the api container.
#
# May 2026 URL layout:
#   /                         → clinic-site (public website)
#   /erp/                     → diagnostic-erp (staff portal)
#   /super-admin-portal/      → super-admin-portal
#   /api/                     → Express REST API

server {
    listen 80 default_server;
    server_name _;

    # Allow file uploads (lab reports, logos, attachments)
    client_max_body_size 25m;

    # Hide nginx version
    server_tokens off;

    # Set Referrer-Policy to allow domain validation for ICICI Orange Pay
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Security headers — applied to every response
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # HSTS: only sent over HTTPS. On LAN (HTTP) this header is omitted so browsers
    # are not permanently locked out of the HTTP endpoint used during initial setup.
    # Remove the $https condition once the site is permanently HTTPS-only.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Allow ICICI Orange Pay iframe/redirect to load on the payment page
    # ICICI requires the Referrer-Policy to send the full origin (already set above)
    add_header Content-Security-Policy "frame-ancestors 'self' https://pgpay.icicibank.com https://pgpayuat.icicibank.com;" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;


    # ---- API reverse proxy ------------------------------------------------
    # The "api" name resolves via docker-compose's internal DNS.
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- Super Admin Portal (BASE_PATH=/super-admin-portal/) -------------
    # Serves the bootstrap page dynamically from the Express container
    location ^~ /super-admin-portal/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---- Staff ERP (BASE_PATH=/erp/) -------------------------------------
    # Two locations are required:
    #   1. Exact match on bare /erp (no trailing slash) — redirect to /erp/
    #      so the SPA loads with the correct base URL.  Without this, nginx
    #      falls through to "location /" which serves the clinic-site SPA and
    #      that SPA shows "Page not found: /erp doesn't exist or isn't published."
    #      because it finds no website-builder page with slug "erp".
    #   2. Prefix match on /erp/ (with trailing slash) — serves the ERP SPA
    #      with SPA fallback (try_files → /erp/index.html) so that deep links
    #      like /erp/dashboard and /erp/billing work on hard-refresh.
    location = /erp {
        return 301 /erp/;
    }
    location ^~ /erp/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /erp/index.html;
    }

    # ---- Public Clinic Website (BASE_PATH=/) — catch-all SPA last --------
    # Excludes /api/, /erp/ (with trailing slash), and the bare /erp path so
    # those routes are handled by their own handlers above and are never
    # swallowed by the website-builder SPA.
    location / {
        root /usr/share/nginx/html/site;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Long cache for hashed asset files
    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        root /usr/share/nginx/html/site;
        try_files $uri /erp$uri /super-admin-portal$uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
