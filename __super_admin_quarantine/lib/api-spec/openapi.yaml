      tags: [super-admin]
      summary: List commission rules
      description: >
        Returns all commission rules, optionally filtered by doctor.
        Each rule defines a percentage or fixed-amount commission earned
        by a referring doctor for specific tests, categories, or all orders.
      parameters:
        - name: doctorId
          in: query
