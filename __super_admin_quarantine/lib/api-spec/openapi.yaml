components:
  schemas:
    ReportTemplate:
      type: object
      properties:
        id:
          type: integer
        testId:
          type: integer
        name:
          type: string
        content:
          type: string
        format:
          type: string
          enum: [html, text]
        isDefault:
          type: boolean
        tags:
          type: string
          nullable: true
        modality:
          type: string
          nullable: true
      required: [id, testId, name, content, format, isDefault]

    CreateReportTemplateBody:
      type: object
      properties:
        testId:
          type: integer
        name:
          type: string
        content:
          type: string
        format:
          type: string
          enum: [html, text]
        isDefault:
          type: boolean
        tags:
          type: string
          nullable: true
        modality:
          type: string
          nullable: true
      required: [testId, name, content]

    UpdateReportTemplateBody:
      type: object
      properties:
