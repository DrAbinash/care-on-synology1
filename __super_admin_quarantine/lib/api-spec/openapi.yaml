openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Diagnostic Center Billing ERP API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: patients
    description: Patient management
  - name: tests
    description: Diagnostic test catalog
  - name: orders
    description: Test orders / requisitions
  - name: bills
    description: Billing and invoices
  - name: payments
    description: Payment records
  - name: reports
    description: Reports and analytics
  - name: doctors
    description: Referring doctors
  - name: appointments
    description: Appointment scheduling
  - name: expenses
    description: Expense management
  - name: super-admin
    description: Super admin commission and ledger operations
  - name: ledgers
    description: Books / ledger group management
  - name: report-templates
    description: Per-test report template library

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Patients
  /patients:
    get:
      operationId: listPatients
      tags: [patients]
      summary: List patients
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of patients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientList"
    post:
      operationId: createPatient
      tags: [patients]
      summary: Register new patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePatientBody"
      responses:
        "201":
          description: Patient created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"

  /patients/{id}:
    get:
      operationId: getPatient
      tags: [patients]
      summary: Get patient by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
    put:
      operationId: updatePatient
      tags: [patients]
      summary: Update patient
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePatientBody"
      responses:
        "200":
          description: Updated patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"

  /patients/{id}/history:
    get:
      operationId: getPatientHistory
      tags: [patients]
      summary: Get patient order history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Patient history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderList"

  # Tests
  /tests:
    get:
      operationId: listTests
      tags: [tests]
      summary: List diagnostic tests
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Tests list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestList"
    post:
      operationId: createTest
      tags: [tests]
      summary: Create diagnostic test
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTestBody"
      responses:
        "201":
          description: Test created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticTest"

  /tests/{id}:
    get:
      operationId: getTest
      tags: [tests]
      summary: Get test by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Test
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticTest"
    put:
      operationId: updateTest
      tags: [tests]
      summary: Update test
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTestBody"
      responses:
        "200":
          description: Updated test
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticTest"
    delete:
      operationId: deleteTest
      tags: [tests]
      summary: Delete test
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: force
          in: query
          schema:
            type: boolean
            default: false
          description: Force deletion even if test has been used in orders
      responses:
        "204":
          description: Test deleted
        "409":
          description: Test has order references
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  refCount:
                    type: integer

  # Outsourced Labs
  /outsourced-labs:
    get:
      operationId: listOutsourcedLabs
      tags: [outsourced-labs]
      summary: List outsourced labs
      responses:
        "200":
          description: List of outsourced labs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OutsourcedLab"
    post:
      operationId: createOutsourcedLab
      tags: [outsourced-labs]
      summary: Create a new outsourced lab
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOutsourcedLabBody"
      responses:
        "201":
          description: Created outsourced lab
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutsourcedLab"

  /outsourced-labs/{id}:
    get:
      operationId: getOutsourcedLab
      tags: [outsourced-labs]
      summary: Get outsourced lab by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Outsourced lab
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutsourcedLab"
    put:
      operationId: updateOutsourcedLab
      tags: [outsourced-labs]
      summary: Update an outsourced lab
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOutsourcedLabBody"
      responses:
        "200":
          description: Updated outsourced lab
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutsourcedLab"
    delete:
      operationId: deleteOutsourcedLab
      tags: [outsourced-labs]
      summary: Delete an outsourced lab
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]

  # Orders
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List test orders
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, collected, processing, completed, cancelled]
        - name: patientId
          in: query
          schema:
            type: integer
            minimum: 1
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
        - name: dateFrom
          in: query
          description: ISO date or date-time string (parsed with new Date()).
          schema:
            type: string
            minLength: 1
        - name: dateTo
          in: query
          description: ISO date or date-time string (parsed with new Date()).
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Orders list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderList"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create test order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderBody"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
    put:
      operationId: updateOrder
      tags: [orders]
      summary: Update order status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderBody"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  # Bills
  /bills:
    get:
      operationId: listBills
      tags: [bills]
      summary: List bills
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, pending, partial, paid, cancelled]
        - name: patientId
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: dateFrom
          in: query
          description: Inclusive start date (YYYY-MM-DD). Filters by created date by default.
          schema:
            type: string
        - name: dateTo
          in: query
          description: Inclusive end date (YYYY-MM-DD). Filters by created date by default.
          schema:
            type: string
      responses:
        "200":
          description: Bills list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillList"
    post:
      operationId: createBill
      tags: [bills]
      summary: Create bill for order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBillBody"
      responses:
        "201":
          description: Bill created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"

  /bills/{id}:
    get:
      operationId: getBill
      tags: [bills]
      summary: Get bill by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
    put:
      operationId: updateBill
      tags: [bills]
      summary: Update bill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBillBody"
      responses:
        "200":
          description: Updated bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"
    delete:
      operationId: deleteBill
      tags: [bills]
      summary: Delete a bill (super admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteBillBody"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  deletedBillNumber:
                    type: string
                required: [success]

  /bills/{id}/reprint-log:
    post:
      operationId: logBillReprint
      tags: [bills]
      summary: Log a reprint of a bill (audited + emailed)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogBillReprintBody"
      responses:
        "200":
          description: Reprint logged
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  reprintCount:
                    type: integer
                required: [success, reprintCount]

  /bills/{id}/audits:
    get:
      operationId: listBillAudits
      tags: [bills]
      summary: List audit-log entries for a bill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BillAudit"

  /bills/{id}/cancel:
    post:
      operationId: cancelBill
      tags: [bills]
      summary: Cancel a bill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelBillBody"
      responses:
        "200":
          description: Cancelled bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"

  /bills/{id}/cancel-test:
    post:
      operationId: cancelBillTest
      tags: [bills]
      summary: Cancel a single test on a bill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelBillTestBody"
      responses:
        "200":
          description: Updated bill after partial cancellation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"

  /bills/{id}/cancel-refund-tests:
    post:
      operationId: cancelRefundTests
      tags: [bills]
      summary: Cancel selected tests and optionally refund their value
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelRefundTestsBody"
      responses:
        "200":
          description: Updated bill after cancelling selected tests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"

  /bills/{id}/refund:
    post:
      operationId: refundBill
      tags: [bills]
      summary: Record a refund against a bill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundBillBody"
      responses:
        "200":
          description: Updated bill after refund
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"

  /bills/{id}/super-edit:
    patch:
      operationId: superEditBill
      tags: [bills]
      summary: Super-admin edit of bill amounts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuperEditBillBody"
      responses:
        "200":
          description: Updated bill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bill"

  # Payments
  /payments:
    get:
      operationId: listPayments
      tags: [payments]
      summary: List payments
      parameters:
        - name: billId
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Payments list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentList"
    post:
      operationId: createPayment
      tags: [payments]
      summary: Record payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentBody"
      responses:
        "201":
          description: Payment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  # Doctors
  /doctors:
    get:
      operationId: listDoctors
      tags: [doctors]
      summary: List referring doctors
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Doctors list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorList"
    post:
      operationId: createDoctor
      tags: [doctors]
      summary: Add referring doctor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDoctorBody"
      responses:
        "201":
          description: Doctor created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doctor"

  /doctors/{id}:
    patch:
      operationId: updateDoctor
      tags: [doctors]
      summary: Update referring doctor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDoctorBody"
      responses:
        "200":
          description: Updated doctor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Doctor"
    delete:
      operationId: deleteDoctor
      tags: [doctors]
      summary: Delete referring doctor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]

  # Branches
  /branches:
    get:
      operationId: listBranches
      tags: [branches]
      summary: List branches
      responses:
        "200":
          description: Branches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Branch"
    post:
      operationId: createBranch
      tags: [branches]
      summary: Create a branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBranchBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"

  /branches/{id}:
    get:
      operationId: getBranch
      tags: [branches]
      summary: Get branch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
    patch:
      operationId: updateBranch
      tags: [branches]
      summary: Update branch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBranchBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Branch"
    delete:
      operationId: deleteBranch
      tags: [branches]
      summary: Delete branch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]

  # Departments
  /departments:
    post:
      operationId: createDepartment
      tags: [departments]
      summary: Create a department
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDepartmentBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"

  /departments/{id}:
    patch:
      operationId: updateDepartment
      tags: [departments]
      summary: Update a department
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDepartmentBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
    delete:
      operationId: deleteDepartment
      tags: [departments]
      summary: Delete a department
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]

  # Abnormal Findings
  /abnormal-findings/{id}:
    get:
      operationId: getAbnormalFinding
      tags: [abnormal-findings]
      summary: Get an abnormal finding
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Abnormal finding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbnormalFinding"
    patch:
      operationId: updateAbnormalFinding
      tags: [abnormal-findings]
      summary: Update an abnormal finding
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAbnormalFindingBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbnormalFinding"
    delete:
      operationId: deleteAbnormalFinding
      tags: [abnormal-findings]
      summary: Delete an abnormal finding
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required: [success]

  /abnormal-findings/{id}/use:
    post:
      operationId: incrementAbnormalFindingUse
      tags: [abnormal-findings]
      summary: Increment usage counter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated abnormal finding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbnormalFinding"

  /abnormal-findings:
    get:
      operationId: listAbnormalFindings
      tags: [abnormal-findings]
      summary: List abnormal findings (filtered)
      parameters:
        - name: testId
          in: query
          required: false
          schema:
            type: integer
        - name: modality
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: limit
