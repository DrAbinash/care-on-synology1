    post:
      operationId: createCommissionRule
      tags: [super-admin]
      summary: Create a commission rule
      description: >
        Creates a new commission rule for a doctor. Scope controls whether
        the rule applies to all orders, a specific test category, or a
        specific test. Only one rule per doctor+scope combination is allowed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommissionRuleBody"
      responses:
        "201":
          description: Created rule
          content:
