# Dedicated DS225+ Emergency Billing stack (this repository).
# Does NOT reuse CARE care-db / diagnostic_erp / Hyper Backup vaults.
#
# Deploy path: /volume1/docker/care-emergency/
#   git clone https://github.com/DrAbinash/225app.git /volume1/docker/care-emergency
#   cp .env.example .env && edit secrets
#   docker compose --env-file .env up -d --build
#
# Never point volumes at Hyper Backup destination shares.

name: care-emergency

services:
  care-emergency-db:
    image: postgres:16-alpine
    container_name: care-emergency-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${EMERGENCY_DB_USER}
      POSTGRES_PASSWORD: ${EMERGENCY_DB_PASSWORD}
      POSTGRES_DB: ${EMERGENCY_DB_NAME:-care_emergency}
    volumes:
      - care_emergency_db_data:/var/lib/postgresql/data
    ports:
      - "${EMERGENCY_DB_BIND:-127.0.0.1}:${EMERGENCY_DB_HOST_PORT:-5410}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EMERGENCY_DB_USER} -d ${EMERGENCY_DB_NAME:-care_emergency}"]
      interval: 5s
      timeout: 5s
      retries: 20

  care-emergency-api:
    build:
      # Repo root so file:../../lib/emergency-billing and
      # extends ../../tsconfig.base.json resolve during the image build.
      context: .
      dockerfile: artifacts/emergency-billing/Dockerfile
    image: care-emergency-api:local
    container_name: care-emergency-api
    restart: unless-stopped
    depends_on:
      care-emergency-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${EMERGENCY_DB_USER}:${EMERGENCY_DB_PASSWORD}@care-emergency-db:5432/${EMERGENCY_DB_NAME:-care_emergency}
      PORT: "8898"
      EMERGENCY_FETCH_TOKEN: ${EMERGENCY_FETCH_TOKEN}
      EMERGENCY_BOOTSTRAP_USERNAME: ${EMERGENCY_BOOTSTRAP_USERNAME:-}
      EMERGENCY_BOOTSTRAP_PIN: ${EMERGENCY_BOOTSTRAP_PIN:-}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      TZ: Asia/Kolkata
      BACKUP_DIR: /backups
      BACKUP_EVERY_HOURS: "6"
      BACKUP_KEEP: "14"
      APP_VERSION: ${APP_VERSION:-1.0.0}
      BUILD_SHA: ${GIT_COMMIT:-unknown}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      PRIMARY_CARE_URL: ${PRIMARY_CARE_URL:-}
      EMERGENCY_DEVICE_ID: ${EMERGENCY_DEVICE_ID:-windows-emergency}
      MASTER_PULL_INTERVAL_HOURS: ${MASTER_PULL_INTERVAL_HOURS:-6}
      CARE_OFFLINE_GRACE_MS: ${CARE_OFFLINE_GRACE_MS:-90000}
    volumes:
      - ${EMERGENCY_BACKUP_DIR:-care_emergency_backups}:/backups
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8898/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  care-emergency-web:
    image: nginx:1.27-alpine
    container_name: care-emergency-web
    restart: unless-stopped
    depends_on:
      care-emergency-api:
        condition: service_healthy
    ports:
      - "${EMERGENCY_HTTP_BIND:-0.0.0.0}:${EMERGENCY_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  care_emergency_db_data:
    name: care_emergency_db_data
  care_emergency_backups:
    name: care_emergency_backups
